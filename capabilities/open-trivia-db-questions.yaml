naftiko: 1.0.0-alpha2
info:
  label: Open Trivia DB API — Questions
  description: 'Open Trivia DB API — Questions. 1 operations. Lead operation: Retrieve trivia questions. Self-contained Naftiko
    capability covering one Open Trivia Db business surface.'
  tags:
  - Open Trivia Db
  - Questions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPEN_TRIVIA_DB_API_KEY: OPEN_TRIVIA_DB_API_KEY
capability:
  consumes:
  - type: http
    namespace: open-trivia-db-questions
    baseUri: https://opentdb.com
    description: Open Trivia DB API — Questions business capability. Self-contained, no shared references.
    resources:
    - name: api.php
      path: /api.php
      operations:
      - name: getquestions
        method: GET
        description: Retrieve trivia questions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: amount
          in: query
          type: integer
          description: Number of questions to return (1-50).
          required: true
        - name: category
          in: query
          type: integer
          description: Category ID to filter by. Omit for any category.
        - name: difficulty
          in: query
          type: string
          description: Question difficulty.
        - name: type
          in: query
          type: string
          description: Question type.
        - name: encode
          in: query
          type: string
          description: Response encoding format.
        - name: token
          in: query
          type: string
          description: Session token to avoid duplicate questions.
  exposes:
  - type: rest
    namespace: open-trivia-db-questions-rest
    port: 8080
    description: REST adapter for Open Trivia DB API — Questions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api-php
      name: api-php
      description: REST surface for api.php.
      operations:
      - method: GET
        name: getquestions
        description: Retrieve trivia questions
        call: open-trivia-db-questions.getquestions
        with:
          amount: rest.amount
          category: rest.category
          difficulty: rest.difficulty
          type: rest.type
          encode: rest.encode
          token: rest.token
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: open-trivia-db-questions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Open Trivia DB API — Questions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: retrieve-trivia-questions
      description: Retrieve trivia questions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-trivia-db-questions.getquestions
      with:
        amount: tools.amount
        category: tools.category
        difficulty: tools.difficulty
        type: tools.type
        encode: tools.encode
        token: tools.token
      outputParameters:
      - type: object
        mapping: $.
